<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל מערכת שעות חכם</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Theme Toggle Button -->
<button id="themeToggleBtn" onclick="toggleTheme()" title="החלף עיצוב">
    <!-- Icon injected by JS -->
</button>

<!-- Settings Button -->
<button id="settingsToggleBtn" onclick="openSettingsDialog()" title="הגדרות">
    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</button>

<!-- Calendar-preview control bar: shown instead of a plain list while picking
     a course's group (see startPreview() in app.js) — a plain fixed bar
     rather than a <dialog>, deliberately, so the real calendar underneath
     stays clickable (a native <dialog>.showModal() blocks that). -->
<div id="previewControlBar" class="preview-control-bar" style="display:none;"></div>

<div class="container">
    <h2 style="text-align: center; margin-top: 0;">מחולל מערכת שעות חכם</h2>
    
    <div class="header-panel">
        <div class="search-box">
            <input type="text" id="courseSearchInput" autocomplete="off"
                   placeholder="חיפוש קורס — לדוגמה: קריפטואנליזה"
                   oninput="onSearchInput()" onfocus="onSearchInput()">
            <div id="searchResultsDropdown" class="search-results-dropdown" style="display:none;"></div>
        </div>

        <div class="btn-group">
            <button class="btn-simple icon-only" onclick="openManualAdd()" title="הוספה ידנית / הדבקת טקסט">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="btn-simple icon-only" id="undoBtn" onclick="undoAction()" disabled title="בטל פעולה אחרונה">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>
            
            <div class="dropdown">
                <button class="btn-simple">ייצא ▼</button>
                <div class="dropdown-content">
                    <button onclick="exportData()">נתונים (JSON)</button>
                    <button onclick="exportToImage('png')">תמונה (PNG)</button>
                    <button onclick="exportToImage('jpeg')">תמונה (JPG)</button>
                    <button onclick="exportToPDF()">מסמך (PDF)</button>
                </div>
            </div>

            <button class="btn-simple" onclick="document.getElementById('importFile').click()">ייבא קובץ</button>
            <button class="danger" onclick="clearAll()">נקה הכל</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- Layout Container (x1 to x2) -->
    <div class="main-layout">
        
        <!-- Sidebar placed absolutely outside (x2 to x4) -->
        <div class="sidebar">
            <h3>ניהול קורסי בחירה</h3>
            <ul class="elective-list" id="electiveSidebarList">
            </ul>
        </div>

        <!-- Central Column for Controls and Calendar (Taking up full x1 to x2 width) -->
        <div class="schedule-column">
            
            <div class="controls">
                <button class="btn-simple" onclick="changeSchedule(-1)">הקודם</button>
                <span class="status" id="scheduleStatus">מערכת 0 מתוך 0</span>
                <button class="btn-simple" onclick="changeSchedule(1)">הבא</button>
                
                <!-- Smart reload button -->
                <button class="btn-simple icon-only" onclick="jumpToBestSchedule()" title="קפוץ למערכת הכי מומלצת">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
                
                <select id="semesterSelect" onchange="onSemesterChange()" style="margin-right: auto;">
                    <option value="א'">סמסטר א'</option>
                    <option value="ב'">סמסטר ב'</option>
                    <option value="קיץ">קיץ</option>
                </select>

                <div class="legend">
                    <div class="legend-item"><span style="color: var(--icon-free); display: flex;"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> פנוי</div>
                    <div class="legend-item"><span style="color: var(--icon-conditional); display: flex;"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> דורש שינויים / גרירה</div>
                    <div class="legend-item"><span style="color: var(--icon-locked); display: flex;"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> חסום</div>
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="calendar-headers">
                    <div class="header-cell time-hdr">שעה</div>
                    <div class="header-cell">ראשון (א')</div>
                    <div class="header-cell">שני (ב')</div>
                    <div class="header-cell">שלישי (ג')</div>
                    <div class="header-cell">רביעי (ד')</div>
                    <div class="header-cell">חמישי (ה')</div>
                </div>
                <div class="calendar-body" id="calendarBody">
                    <div class="time-col" id="timeGrid"></div>
                    <div class="day-col" id="day-א" data-day="ראשון (א')"></div>
                    <div class="day-col" id="day-ב" data-day="שני (ב')"></div>
                    <div class="day-col" id="day-ג" data-day="שלישי (ג')"></div>
                    <div class="day-col" id="day-ד" data-day="רביעי (ד')"></div>
                    <div class="day-col" id="day-ה" data-day="חמישי (ה')"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="course-list">
        <h3>רשימת הקורסים במערכת:</h3>
        <div id="addedCoursesList"></div>
    </div>
</div>

<!-- Edit Modal with Custom Color Option -->
<dialog id="editDialog">
    <h3 style="margin-top:0;" id="editDialogTitle">ערוך שיעור</h3>
    <input type="hidden" id="editId">

    <!-- Moved here from the header: paste-based add, now reached via the
         manual-add ("+") button instead of being the primary flow — the
         search bar above is the primary way to add a course now. Hidden
         entirely when editing an existing entry (openEdit()). -->
    <div id="pasteAddSection">
        <div class="form-group">
            <label>הדבקת פרטי קורס (אופציונלי)</label>
            <textarea id="pasteArea" style="height:80px;" placeholder='הדבק כאן את פרטי הקורס. לדוגמה:
שיבוץ פנוי חובה הרצאה מבנה מחשב 89230-01 סמסטר א ב 15:00-18:00...'></textarea>
        </div>
        <div class="paste-options">
            <label class="toggle-label">
                <div class="switch">
                    <input type="checkbox" id="addAsElectiveToggle">
                    <span class="slider"></span>
                </div>
                סמן קורס זה כבחירה (אופציונלי)
            </label>
        </div>
        <div class="form-group">
            <button class="btn-simple" style="width:100%;" onclick="processInput()">הוסף מטקסט</button>
        </div>
        <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
        <p style="margin:0 0 10px; font-size:13px; color:var(--text-muted);">או מלאו את הפרטים ידנית:</p>
    </div>

    <div class="form-group">
        <label>שם הקורס</label>
        <input type="text" id="editName">
    </div>
    <div class="form-group">
        <label>סוג (הרצאה/תרגיל)</label>
        <select id="editType">
            <option value="הרצאה">הרצאה</option>
            <option value="תרגיל">תרגיל</option>
            <option value="מעבדה">מעבדה</option>
            <option value='שו"ת'>שו"ת</option>
            <option value="סדנא">סדנא</option>
            <option value="תגבור">תגבור</option>
            <option value="שיעור">שיעור (אחר)</option>
        </select>
    </div>
    <div class="form-group">
        <label>סמסטר</label>
        <select id="editSemester">
            <option value="א'">א'</option>
            <option value="ב'">ב'</option>
            <option value="שנתי">שנתי</option>
            <option value="קיץ">קיץ</option>
        </select>
    </div>
    <div class="form-group">
        <label>יום</label>
        <select id="editDay">
            <option value="א">ראשון</option>
            <option value="ב">שני</option>
            <option value="ג">שלישי</option>
            <option value="ד">רביעי</option>
            <option value="ה">חמישי</option>
        </select>
    </div>
    <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
            <label>שעת התחלה</label>
            <input type="time" id="editStart">
        </div>
        <div class="form-group" style="flex:1;">
            <label>שעת סיום</label>
            <input type="time" id="editEnd">
        </div>
    </div>
    <div class="form-group">
        <label>צבע קורס (אופציונלי)</label>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="color" id="editColor" value="#4a90e2" style="width: 50px; height:40px; padding:2px; cursor:pointer;">
            <label style="font-weight:normal; font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer;">
                <input type="checkbox" id="editUseCustomColor"> השתמש בצבע מותאם אישית
            </label>
        </div>
    </div>
    <div class="dialog-buttons">
        <button class="danger" onclick="deleteFromEdit()" id="editDeleteBtn">מחק שיעור</button>
        <button class="btn-simple" onclick="document.getElementById('editDialog').close()">ביטול</button>
        <button class="btn-simple" onclick="saveEdit()" style="background: var(--primary); color: white; border: none;">שמור שינויים</button>
    </div>
</dialog>

<!-- Shown after picking a course from the search bar: lists its real groups
     (lecture/exercise/lab/seminar/reinforcement) so the student can add one —
     same guided flow (lecture unlocks exercise, reinforcement always
     optional) as the rest of the app, adapted into this site's own dialog
     style rather than a separate component system. -->
<dialog id="searchAddDialog">
    <h3 style="margin-top:0;" id="searchAddTitle">קורס</h3>
    <p id="searchAddMeta" style="margin:-8px 0 14px; font-size:13px; color:var(--text-muted);"></p>
    <label class="toggle-label" style="margin-bottom:14px;">
        <div class="switch">
            <input type="checkbox" id="searchAddElectiveToggle" onchange="onSearchAddElectiveToggleChange()">
            <span class="slider"></span>
        </div>
        סמן קורס זה כבחירה
    </label>
    <div id="searchAddGroups"></div>
    <div class="dialog-buttons">
        <!-- Shown only when reached via the ✏️ edit button on an existing
             entry (openEdit() -> openSearchEditDialog()) — lets you fall
             back to the plain structured form for that one entry. -->
        <button class="btn-simple" id="searchAddManualEditBtn" style="display:none;" onclick="openManualEditFromSearch()">עריכה ידנית</button>
        <button class="btn-simple" onclick="document.getElementById('searchAddDialog').close()">סגירה</button>
    </div>
</dialog>

<dialog id="settingsDialog">
    <h3 style="margin-top:0;">הגדרות</h3>

    <div class="settings-row">
        <span>אפשר חפיפות (מצב מפתח)</span>
        <!-- Must be a <label> WRAPPING the input (not a <div> with the text
             in a separate `for`-linked label) — the actual <input> is
             invisible (opacity:0, 0x0 — see .switch input in styles.css) and
             only the sibling .slider is visually clickable; a `for` attribute
             on a label elsewhere doesn't make clicking the slider toggle it,
             only a label that visually contains it does. -->
        <label class="switch">
            <input type="checkbox" id="settingsOverlapsToggle" class="danger-switch" onchange="setDevMode(this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="settings-row">
        <span>אפשר בחירת תרגיל בלי הרצאה</span>
        <label class="switch">
            <input type="checkbox" id="settingsExerciseWithoutLectureToggle" onchange="setAllowExerciseWithoutLecture(this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="settings-row">
        <label>ערכת נושא</label>
        <div class="theme-radio-group">
            <label><input type="radio" name="settingsTheme" value="light" onchange="setTheme('light')"> בהיר</label>
            <label><input type="radio" name="settingsTheme" value="dark" onchange="setTheme('dark')"> כהה</label>
            <label><input type="radio" name="settingsTheme" value="system" onchange="setTheme('system')"> מערכת</label>
        </div>
    </div>

    <div class="settings-row">
        <label>צבעים מותאמים אישית שנשמרו לקורסים</label>
        <button class="btn-simple" style="padding:6px 12px; font-size:13px;" onclick="resetAllCustomColors()">איפוס</button>
    </div>

    <div class="dialog-buttons">
        <button class="btn-simple" onclick="document.getElementById('settingsDialog').close()">סגירה</button>
    </div>
</dialog>

<script src="vendor/uFuzzy.iife.min.js"></script>
<script src="app.js"></script>

</body>
</html>
